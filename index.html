function logo(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,400/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');if(u.length>170000){const x=c.getContext('2d');x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}S.set.logo=u;save();go('Settings')};im.src=r.result};r.readAsDataURL(f)}
function nd(i){if(i){const o=JSON.parse(JSON.stringify({...i,orig:i.no}));o.items.forEach(x=>{if(x.g==null)x.g=S.set.dr});return o}const p=S.set.prefix,m=Math.max(S.set.next-1,...S.inv.filter(x=>x.no.startsWith(p)).map(x=>parseInt(x.no.slice(p.length))||0)),n=String(m+1).padStart(3,'0');return{no:p+n,dn:n,date:today(),party:'',gstin:'',mob:'',addr:'',bo:'',bod:'',tod:'',gst:true,items:[{d:'',h:'',q:1,r:0,u:'Pcs',g:S.set.dr}]}}

const o={no:i.no,dn:i.dn,date:i.date,party:i.party,gstin:i.gstin,mob:i.mob,addr:i.addr,bo:i.bo,bod:i.bod,tod:i.tod,gst:t.gst,inter:t.inter,items:i.items,qt:t.qt,taxable:t.tx,tax:t.tax,ro:t.ro,total:t.total,tds:i.tds||0,tdsd:i.tdsd||''};
const k=S.inv.findIndex(x=>x.no==i.orig);if(k>=0)S.inv[k]=o;else S.inv.push(o);S.parties[i.party]={gstin:i.gstin,addr:i.addr,mob:i.mob};save();ed=null;show(o.no,0,0,k<0);go('Invoices')}

function delInv(n){if(confirm('Delete invoice '+n+'?')){S.inv=S.inv.filter(x=>x.no!=n);save();go('Invoices')}}
function addPay(){const p={id:'p'+Date.now(),date:$('pd').value,party:$('pp').value,amt:+$('pm').value,mode:$('pmd').value,ref:$('pr').value};if(!p.party||!(p.amt>0)||!p.date)return alert('Choose party, date and a valid amount.');S.pay.push(p);save();go('Payments')}

function show(n,dc,hide,ask){const i=dc?S.dc.find(x=>x.no==n):S.inv.find(x=>x.no==n),s=S.set,g=i.gst!==false,H=dc&&hide,tax=i.tax||[{rate:1,base:i.taxable,cg:i.cg||0,sg:i.sg||0,ig:0}],qt=i.qt??i.items.reduce((a,x)=>a+x.q,0),L=g&&!H?tl(tax):[],ra='style="text-align:right"',rw=(a,b)=>`<tr><td></td><td ${ra}>${a}</td><td></td><td></td><td></td><td></td><td ${ra}>${b}</td></tr>`;
$('ovc').innerHTML=(dc?`<div class="tb"><button class="s" style="background:#fff" onclick="show('${esc(n)}',1,${H?0:1})">${H?'Show':'Hide'} rates and amounts</button></div>`:'')+`<div class="inv"><div class="lh"><div>${s.logo?`<img src="${s.logo}">`:`<h1>${esc(s.name)}</h1>`}</div><div class="rt">${s.pan?'PAN No. '+esc(s.pan)+'<br>':''}${g&&s.gstin?'GST No. '+esc(s.gstin)+'<br>':''}${s.udyam?'Udyam No. '+esc(s.udyam):''}</div></div>
<div class="ti">${dc?'DELIVERY CHALLAN':g?'TAX INVOICE':'INVOICE'}</div>
<table class="bx"><tr><td rowspan="2" style="width:58%"><b>${esc(s.name)}</b><br>${nl(s.addr)}${g&&s.gstin?'<br>GSTIN: '+esc(s.gstin):''}${s.email?'<br>E-Mail: '+esc(s.email):''}</td><td><b>${dc?'Challan No.':'Invoice No.'}</b><br>${esc(i.no)}</td><td><b>Date</b><br>${fd(i.date)}</td></tr>
<tr><td><b>Delivery Note</b><br>${esc(i.dn)}</td><td>${dc?`<b>Against Invoice No.</b><br>${esc(i.inv)} dt. ${fd(i.invDate)}`:`<b>Terms of Payments</b><br>${esc(s.pt)}`}</td></tr>
<tr><td rowspan="2" style="height:105px">Buyer (Bill to)<br><b>${esc(i.party)}</b><br>${nl(i.addr)}${i.gstin?'<br>GSTIN: '+esc(i.gstin):''}${i.mob?'<br>MOBILE NO. '+esc(i.mob):''}</td><td><b>Buyers Order No.</b><br>${esc(i.bo)}</td><td><b>Date</b><br>${fd(i.bod)}</td></tr>
<tr><td colspan="2"><b>Terms of Delivery</b><br>${esc(i.tod)}</td></tr></table>
<table class="it"><tr><th style="width:5%">Sr No.</th><th>Description of Goods</th><th style="width:12%">HSN/SAC</th><th style="width:10%">Quantity</th><th style="width:11%">Rate</th><th style="width:6%">Per</th><th style="width:14%">Amount</th></tr>
${i.items.map((x,k)=>`<tr><td style="text-align:center;vertical-align:top">${k+1}</td><td style="vertical-align:top">${nl(x.d)}</td><td style="vertical-align:top">${esc(x.h)}</td><td style="text-align:right;vertical-align:top">${x.q}</td><td style="text-align:right;vertical-align:top">${H?'':fm(x.r)}</td><td style="vertical-align:top">${esc(x.u)}</td><td style="text-align:right;vertical-align:top">${H?'':fm(x.q*x.r)}</td></tr>`).join('')}
<tr><td style="height:${Math.max(30,150-i.items.length*24)}px"></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>${L.map(x=>rw(x[0],fm(x[1]))).join('')}${g&&!H?rw('Round Off',i.ro?fm(i.ro):'-'):''}
<tr class="tl"><td></td><td ${ra}>Total</td><td></td><td ${ra}>${qt}</td><td></td><td></td><td ${ra}><b>${H?'':fm(i.total)}</b></td></tr></table>
${H?'':`<div class="wd">Amount Chargeable (in words)<br><b>${words(i.total)}</b></div>`}
<table style="margin-top:14px"><tr><td style="width:55%;vertical-align:top">${dc?'':"Company's Bank Details<br>"+nl(s.bank)}</td><td style="vertical-align:top"><br><br>For, ${esc(s.name)}<br><br><br><br>Authorised Signatory</td></tr></table>
<div class="ft">${esc(s.svc)}</div></div>`+(ask?`<div class="tb" style="background:#fff;color:#111;padding:12px;border-radius:8px;margin-top:10px;align-items:center;flex-wrap:wrap"><b>Is a delivery challan required for this invoice?</b><button class="b" onclick="makeDc('${esc(n)}')">Yes, create</button><button class="s" onclick="cl()">No</button></div>`:'');$('ov').style.display='block'}
function makeDc(no){let d=S.dc.find(x=>x.inv==no);if(!d){const i=S.inv.find(x=>x.no==no),p=S.set.dcp,m=Math.max(0,...S.dc.filter(x=>x.no.startsWith(p)).map(x=>parseInt(x.no.slice(p.length))||0));d={...cln(i),no:p+String(m+1).padStart(3,'0'),date:today(),inv:i.no,invDate:i.date};delete d.tds;delete d.tdsd;S.dc.push(d);save()}show(d.no,1,0)}
function delDc(n){if(confirm('Delete delivery challan '+n+'?')){S.dc=S.dc.filter(x=>x.no!=n);save();go('Delivery Challans')}}
function tdsForm(no){const i=S.inv.find(x=>x.no==no);$('ovc').innerHTML=`<div class="cd" style="max-width:420px;margin:40px auto"><h2>TDS deducted by buyer</h2><p style="color:var(--mu)">Invoice ${esc(no)}: taxable value ${fm(i.taxable)}, invoice total ${fm(i.total)}</p><label>TDS % on taxable value (optional helper)<input id="tp" type="number" step="any" oninput="$('ta').value=r2(${i.taxable}*this.value/100)"></label><label>TDS amount (enter 0 to remove)<input id="ta" type="number" step="any" value="${i.tds||''}"></label><label>Date of deduction<input id="td" type="date" value="${i.tdsd||today()}"></label><div class="row"><button class="b" onclick="saveTds('${esc(no)}')">Save</button><button class="s" onclick="cl()">Cancel</button></div></div>`;$('ov').style.display='block'}

function printLedger(){const x=calc().P[lp],s=S.set,t=(()=>{const c=$('lgt').cloneNode(true);c.querySelectorAll('.na').forEach(e=>e.remove());return c.outerHTML})();$('ovc').innerHTML=`<div class="inv"><div class="h"><div><h1>${esc(s.name)}</h1>${nl(s.addr)}</div><div style="text-align:right"><h1>LEDGER</h1>${esc(lp)}<br>As on ${fd(today())}</div></div><div class="lg">${t}</div><p><b>${x.bal<0?'Advance held':'Closing balance due'}: ₹ ${fm(Math.abs(x.bal))}</b></p></div>`;$('ov').style.display='block'}

function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.inv||!d.pay||!d.parties)throw 0;if(!confirm('Replace all current data with this backup?'))return;const au=S.set.auth,us=S.set.users;S=d;S.dc=S.dc||[];S.set={...dS.set,...S.set,auth:au,users:us};save();go('Dashboard')}catch(e){alert('This file is not a valid backup.')}};r.readAsText(f)}
/* ---- login lock ---- */
let dbp=true,lm='',rc='',cu='';try{cu=sessionStorage.getItem('mc_u')||''}catch(e){}
const U=()=>{const t=S.set;if(t.auth){t.users=[...(t.users||[]),t.auth];t.auth=null;save()}return t.users=(t.users&&t.users!==dS.set.users)?t.users:[]};
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b))),rnd=n=>enc(crypto.getRandomValues(new Uint8Array(n))),em=t=>{$('em').textContent=t},uv=id=>$(id).value.trim().toLowerCase();
async function hp(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return enc(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256))}
function showLock(force){const n=U().length;if(!force&&$('lk')&&lm&&lm!='wait')return;const m=force||(n?'in':(dbp||(db&&!ready))?'wait':'new');if(m==lm&&$('lk'))return;lm=m;$('nav').innerHTML='';$('lo').style.display='none';

const H={wait:'<h2>Mechcore Billing</h2><p>Connecting to your saved data…</p>',
in:tabs+(n?'':'<p class="bad">No login exists yet. Choose Create Login ID.</p>')+`<label>User ID<input id="u1" autocomplete="username"></label><label>Password<input id="p1" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label><div class="row"><button class="b" onclick="doLogin()">Login</button><button class="s" onclick="showLock('fg')">Forgot password?</button></div><p id="em" class="bad"></p>`,
new:tabs+`<p style="color:var(--mu)">Choose a user ID and password to protect your billing data.</p>`+`<label>New user ID<input id="u1" autocomplete="username"></label><label>New password (min 6 characters)<input id="p1" type="password" autocomplete="new-password"></label><label>Confirm password<input id="p2" type="password" autocomplete="new-password"></label><div class="row"><button class="b" onclick="mkAuth()">Create Login ID</button></div><p id="em" class="bad"></p>`,
rec:`<h2>Save your recovery code</h2><p>If you forget your password, this code is the only way to reset it. Write it down now; it is shown only once.</p><p style="font-size:22px;letter-spacing:2px;font-weight:700">${rc}</p><div class="row"><button class="b" onclick="unlock()">I have saved it, continue</button></div>`,
fg:`<h2>Reset password</h2><label>User ID<input id="u1"></label><label>Recovery code<input id="rcv"></label><label>New password (min 6 characters)<input id="p1" type="password"></label><div class="row"><button class="b" onclick="doReset()">Reset and login</button><button class="s" onclick="showLock('in')">Back</button></div><p id="em" class="bad"></p>`};

function resetLogins(){if(prompt('This removes ALL saved login IDs. Your bills, parties and payments are NOT touched. Type RESET to continue.')!=='RESET')return;S.set.users=[];S.set.auth=null;save();lm='';showLock('new')}
async function mkAuth(){const us=U(),u=uv('u1'),p=$('p1').value;
if(u.length<3)return em('User ID must be at least 3 characters.');if(us.some(x=>x.u==u))return em('This user ID already exists.');if(p.length<6)return em('Password must be at least 6 characters.');if(p!=$('p2').value)return em('Passwords do not match.');
rc=Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('').match(/.{4}/g).join('-');
const s=rnd(16),r=rnd(16);us.push({u,s,h:await hp(p,s),r,rh:await hp(rc.replace(/-/g,''),r)});cu=u;save();showLock('rec')}
async function doLogin(){const us=U(),u=uv('u1'),e=us.find(x=>x.u==u);if(!us.length)return em('No login exists yet. Choose Create Login ID.');if(e&&await hp($('p1').value,e.s)==e.h){cu=e.u;unlock()}else em('Wrong user ID or password.')}
async function doReset(){const e=U().find(x=>x.u==uv('u1')),c=$('rcv').value.toUpperCase().replace(/[^A-Z0-9]/g,''),p=$('p1').value;if(p.length<6)return em('New password must be at least 6 characters.');if(!e||await hp(c,e.r)!=e.rh)return em('User ID or recovery code is not correct.');e.s=rnd(16);e.h=await hp(p,e.s);cu=e.u;save();unlock()}

async function chPw(){const a=U().find(x=>x.u==cu),o=$('cp0').value,n=$('cp1').value;if(!a)return alert('Please log out and log in again first.');if(await hp(o,a.s)!=a.h)return alert('Current password is wrong.');if(n.length<6)return alert('New password must be at least 6 characters.');a.s=rnd(16);a.h=await hp(n,a.s);save();alert('Password changed.')}
let locked=true;try{if(sessionStorage.getItem('mc_ok')=='1')locked=false}catch(e){}
go('Dashboard');initDb();
